<!DOCTYPE html><html lang="fr" dir="auto"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feuille de présence</title><style>body{font-family:Arial,sans-serif;max-width:650px;margin:20px auto;padding:16px;background:#f5f5f5}.card{background:#fff;padding:20px;border-radius:14px}h2{text-align:center}.meta{text-align:center;color:#555;margin-bottom:18px}.person{padding:12px;border-bottom:1px solid #eee;font-size:18px}.person input{transform:scale(1.35);margin:0 10px}button{width:100%;padding:15px;font-size:18px;background:#25D366;color:white;border:0;border-radius:8px;margin-top:20px}.back{display:block;margin-bottom:15px;color:#1f6feb;text-decoration:none}</style></head><body><div class="card"><a class="back" href="index.html">← Retour</a><h2>Absences du jour</h2><div id="meta" class="meta"></div><div id="students">Chargement...</div><button onclick="envoyer()">Envoyer par WhatsApp</button></div><script>
const q=new URLSearchParams(location.search),teacher=q.get('teacher')||'',className=q.get('class')||'';document.getElementById('meta').textContent=`${teacher} — ${className}`;
fetch('students.json').then(r=>r.json()).then(data=>{const list=data.filter(x=>x.teacher===teacher&&x.class===className);document.getElementById('students').innerHTML=list.length?list.map(s=>`<div class="person"><label><input type="checkbox" value="${s.name.replaceAll('&','&amp;').replaceAll('"','&quot;')}"> ${s.name}</label></div>`).join(''):'Aucun élève trouvé.';});
function envoyer(){const absents=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);const date=new Date().toLocaleDateString('fr-FR');let message=`Absences - ${className}\nProfesseur : ${teacher}\nDate : ${date}\n\n`;message+=absents.length?'Absents :\n- '+absents.join('\n- '):"Aucune absence aujourd'hui.";const numero='33603151232';location.href='https://wa.me/'+numero+'?text='+encodeURIComponent(message);}
</script></body></html>
