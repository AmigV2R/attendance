<!DOCTYPE html><html lang="fr" dir="auto"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choix classe</title><style>body{font-family:Arial,sans-serif;max-width:600px;margin:40px auto;padding:20px;background:#f5f5f5}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001}h2{text-align:center}label{display:block;margin-top:18px;font-weight:bold}select,button{width:100%;box-sizing:border-box;padding:14px;margin-top:7px;font-size:17px;border-radius:8px;border:1px solid #ccc}button{margin-top:24px;background:#1f6feb;color:white;border:0;font-weight:bold}button:disabled{opacity:.45}</style></head><body><div class="card"><h2>Feuille de présence</h2><label>Professeur</label><select id="teacher"><option value="">-- Choisir --</option></select><label>Classe</label><select id="class"><option value="">-- Choisir --</option></select><button id="go" disabled>Afficher les élèves</button></div><script>
let data=[]; const t=document.getElementById('teacher'),c=document.getElementById('class'),go=document.getElementById('go');
const uniq=a=>[...new Set(a)].sort((a,b)=>a.localeCompare(b,'ar'));
function fill(sel,values,current){sel.innerHTML='<option value="">-- Choisir --</option>'+values.map(v=>`<option ${v===current?'selected':''}>${v}</option>`).join('');}
function refresh(changed){let tv=t.value,cv=c.value;if(changed==='teacher'){const classes=uniq(data.filter(x=>!tv||x.teacher===tv).map(x=>x.class)); if(cv&&!classes.includes(cv))cv='';fill(c,classes,cv);}else if(changed==='class'){const teachers=uniq(data.filter(x=>!cv||x.class===cv).map(x=>x.teacher));if(tv&&!teachers.includes(tv))tv='';fill(t,teachers,tv);}go.disabled=!(t.value&&c.value);}
fetch('students.json').then(r=>r.json()).then(x=>{data=x;fill(t,uniq(data.map(x=>x.teacher)), '');fill(c,uniq(data.map(x=>x.class)), '');});
t.onchange=()=>refresh('teacher');c.onchange=()=>refresh('class');go.onclick=()=>location.href=`attendance.html?teacher=${encodeURIComponent(t.value)}&class=${encodeURIComponent(c.value)}`;
</script></body></html>
