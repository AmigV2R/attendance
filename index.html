<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sélection de classe</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
}
select,button{
    width:100%;
    padding:12px;
    margin:10px 0;
    font-size:18px;
}
button{
    background:#25D366;
    color:white;
    border:none;
    border-radius:8px;
}
</style>
</head>
<body>

<h2>Choisir une classe</h2>

<select id="teacher">
    <option value="">Choisir l'enseignant</option>
    <option>لبنى</option>
    <option>نور</option>
    <option>نيفين</option>
    <option>زينة</option>
    <option>حليمة</option>
    <option>سماح</option>
    <option>مروة</option>
    <option>دانا د</option>
    <option>رشا ق</option>
    <option>رهف</option>
    <option>رولا</option>
    <option>صفاء</option>
</select>

<select id="classe">
    <option value="">Choisir la classe</option>
    <option>روضة</option>
    <option>تحضيري</option>
    <option>روضة تحضيري</option>
    <option>الأول</option>
    <option>الثاني</option>
    <option>الثالث</option>
    <option>الرابع</option>
    <option>الخامس</option>
    <option>السادس</option>
    <option>السابع</option>
    <option>أول ثانوي</option>
    <option>أول كبار</option>
    <option>الثاني كبار</option>
    <option>الثالث كبار</option>
</select>

<button onclick="ouvrirPresence()">
    Continuer
</button>

<script>
function ouvrirPresence(){

    const teacher =
        document.getElementById("teacher").value;

    const classe =
        document.getElementById("classe").value;

    if(!teacher || !classe){
        alert("Choisissez la classe et l'enseignant.");
        return;
    }

    window.location.href =
        `presence.html?teacher=${encodeURIComponent(teacher)}&class=${encodeURIComponent(classe)}`;
}
</script>

</body>
</html>
