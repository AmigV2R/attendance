<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feuille de présence</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}
h2{
    text-align:center;
}
.person{
    margin:10px 0;
}
button{
    width:100%;
    padding:15px;
    font-size:18px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:8px;
}
</style>
</head>
<body>

<h2>Absences du jour</h2>

<div class="person"><label><input type="checkbox" value="Jean"> Jean</label></div>
<div class="person"><label><input type="checkbox" value="Marie"> Marie</label></div>
<div class="person"><label><input type="checkbox" value="Pierre"> Pierre</label></div>
<div class="person"><label><input type="checkbox" value="Sophie"> Sophie</label></div>
<div class="person"><label><input type="checkbox" value="Lucas"> Lucas</label></div>
<div class="person"><label><input type="checkbox" value="Emma"> Emma</label></div>

<button onclick="envoyer()">Envoyer par WhatsApp</button>

<script>
function envoyer() {

    let absents = [];

    document.querySelectorAll('input[type=checkbox\]:checked')
        .forEach(cb => absents.push(cb.value));

    let message;

    if(absents.length === 0){
        message = "Aucune absence aujourd'hui.";
    } else {
        message = "Absents aujourd'hui :\n- " +
                  absents.join("\n- ");
    }

    const numero = "33603151232"; // numéro destinataire

    window.location.href =
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(message);
}
</script>

</body>
</html>
